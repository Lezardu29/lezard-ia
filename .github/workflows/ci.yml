# Intégration continue (15.2) : à chaque push et pull request.
#   tests          Windows + Linux, Python 3.11 et 3.13, versions les plus récentes autorisées
#   versions-min   Linux, Python 3.11, dépendances à leur borne basse (vérification manuelle de 10.9)
#   redis          test des compteurs sur un vrai serveur Redis (ignoré partout ailleurs)
#   docker         construction de l'image (sans publication) et démarrage jusqu'à « healthy »
#   qualite        ruff (lint + formatage) et couverture des tests, publiée dans le résumé du run (15.3)
#   audit          pip-audit : dépendance avec une faille connue ; aussi chaque lundi, sans push (15.3)
#   navigateur     le chat et le site dans Chromium (Playwright) : téléphone et ordinateur, erreurs, CSP, mise en page
# Aucun secret n'est utilisé : les tests simulent fournisseurs et tunnels.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"          # chaque lundi : nouvelles failles publiées depuis le dernier push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -W error::DeprecationWarning

  versions-min:
    name: Versions minimales (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dépendances aux bornes basses
        run: |
          python .github/scripts/min_constraints.py | tee constraints-min.txt
          python -m pip install -r requirements-dev.txt -c constraints-min.txt
          python -m pip freeze
      # Seule exception : le TestClient de starlette 0.46 (tests uniquement) utilise une API dépréciée
      # du dernier anyio, que rien ne borne ; le code de la gateway reste soumis à -W error.
      - name: Tests
        run: >-
          python -m pytest -q -W error::DeprecationWarning
          -W "ignore:The anyio.abc.BlockingPortal:DeprecationWarning"

  redis:
    name: Compteurs sur Redis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Tests des compteurs
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        # le test Redis ignoré (serveur injoignable) ferait passer ce job pour rien : échec dans ce cas
        shell: bash
        run: |
          python -m pytest -q -rs tests/test_counters.py | tee pytest.out
          if grep -q "skipped" pytest.out; then echo "::error::test Redis ignoré"; exit 1; fi

  qualite:
    name: Lint, formatage et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff check)
        run: python -m ruff check --output-format=github .
      - name: Formatage (ruff format --check)
        run: python -m ruff format --check --diff .
      - name: Tests avec couverture
        # seuil : fail_under de pyproject.toml (niveau mesuré à la mise en place, à ne pas perdre)
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml --cov-report=html
      - name: Résumé de la couverture
        if: always()
        run: |
          echo "## Couverture des tests" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Rapport détaillé (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: |
            htmlcov
            coverage.xml
          retention-days: 14

  audit:
    name: Failles connues (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: pip-audit
        # dépendances d'exécution, de test et dictée locale facultative, à leurs versions installables actuelles
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-dev.txt -r requirements-local.txt --progress-spinner off

  navigateur:
    name: Navigateur (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dépendances et Chromium
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Tests dans le navigateur
        # sans Playwright (les autres jobs), ces fichiers sont ignorés : ici, ils doivent tourner pour de bon
        env:
          BROWSER_TESTS: required
        run: python -m pytest -q -rs tests/test_browser_ui.py tests/test_site_browser.py

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Construction
        run: docker build -t smart-ai-gateway:ci .
      - name: Démarrage jusqu'à l'état « healthy »
        run: |
          docker run -d --name gw smart-ai-gateway:ci
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' gw)
            echo "santé : $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' gw)" = "true" ] || break
            sleep 3
          done
          docker logs gw
          exit 1
