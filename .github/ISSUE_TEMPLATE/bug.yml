name: Signaler un bug
description: Quelque chose ne marche pas comme prévu dans Lezard IA
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. N'écrivez jamais ici de clé, de mot de passe ni de
        contenu privé de vos conversations : ce signalement est public.
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui se passe
      description: Le problème, et le message d'erreur s'il y en a un.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Pour le reproduire
      description: Les étapes qui mènent au problème.
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Le problème apparaît
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
  - type: input
    id: version
    attributes:
      label: Version de Lezard IA
      description: Remplie toute seule depuis Lezard IA (menu, « Signaler un bug »).
  - type: input
    id: systeme
    attributes:
      label: Système et navigateur
      description: Rempli tout seul depuis Lezard IA.
